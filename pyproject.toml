[project]
name = "pabench"
version = "0.1.0"
description = "Benchmark of Python audio loading libraries, decoding to torch tensors."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "soundfile",
    "torch",
    "matplotlib",
]

[project.scripts]
pabench = "pabench.cli:console_main"

[project.optional-dependencies]
libs = [
    "librosa",
    "scipy",
    "pydub",
    "audioread",
    "stempeg",
    "pedalboard",
    "torchcodec",
]

[dependency-groups]
test = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# Legacy pre-refactor scripts, scheduled for deletion in Task 5 (see
# docs/refactor-plan.md). Not migrated or maintained; excluded rather than
# fixed so effort isn't spent polishing code about to be removed.
extend-exclude = [
    "benchmark_metadata.py",
    "benchmark_np.py",
    "benchmark_pytorch.py",
    "benchmark_tf.py",
    "plot.py",
]

[tool.ruff.lint]
ignore = [
    # Every probe/adapter (pabench/loaders.py, and later pabench/run.py) must
    # catch any exception a third-party decoder raises and record it rather
    # than letting a run abort -- see docs/refactor-design.md, "Error
    # handling". A deliberately broad `except Exception` is central to that
    # design, not an oversight this rule should flag.
    "BLE001",
]

[tool.hatch.build.targets.wheel]
packages = ["pabench"]
