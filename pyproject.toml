[project]
name = "pabench"
version = "0.1.0"
description = "Benchmark of Python audio loading libraries, decoding to torch tensors."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "soundfile",
    "torch",
    "matplotlib",
]

[project.scripts]
pabench = "pabench.cli:console_main"

[project.optional-dependencies]
libs = [
    "librosa",
    "scipy",
    "pydub",
    "audioread",
    "pedalboard",
    "torchcodec",
    "audiolab",
    "audiosample",
    "sphn",
]

[dependency-groups]
test = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Every probe/adapter in these two modules must catch any exception a
# third-party decoder raises and record it rather than letting a run abort --
# see docs/refactor-design.md, "Error handling". A deliberately broad
# `except Exception` is central to that design, not an oversight this rule
# should flag. Scoped to exactly the modules whose design requires it, rather
# than a repo-wide ignore that would also silence the rule where it's not
# warranted.
"pabench/loaders.py" = ["BLE001"]
"pabench/run.py" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["pabench"]
